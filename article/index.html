<script>
var API_BASE = "/api";
var state = {tag:"", col:"", search:"", page:1, size:10, sort:"latest", total:0};
/* 读取 URL 筛选参数（文章详情页"本文标签"跳转携带 ?col= 分栏 或 ?tag= 标签） */
(function(){
  var m=location.search.match(/[?&]col=([^&]+)/);
  if(m){try{state.col=decodeURIComponent(m[1].replace(/\+/g," "));}catch(e){state.col=m[1];}}
})();

function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmtDate(s){if(!s)return "";return String(s).slice(0,10);}
function loadToolsNav(){
  fetch(API_BASE+"/tools.json").then(function(r){return r.json();}).then(function(j){
    if(!j.ok)return;
    var on={};j.data.forEach(function(t){on[t.key]=1;});
    document.querySelectorAll("#navLinks a[data-tool]").forEach(function(a){
      if(!on[a.getAttribute("data-tool")])a.style.display="none";
    });
  }).catch(function(){});
}
function loadColumns(){
  fetch(API_BASE+"/public/columns.json").then(function(r){return r.json();}).then(function(j){
    if(!j.ok)return;
    var html='<span class="col-item on" data-col="">全部<span class="cnt">'+j.data.reduce(function(a,c){return a+c.cnt;},0)+'</span></span>';
    j.data.forEach(function(c){
      html+='<span class="col-item" data-col="'+esc(c.name)+'">'+esc(c.name)+'<span class="cnt">'+c.cnt+'</span></span>';
    });
    var box=document.getElementById("colList");
    box.innerHTML=html;
    /* URL 带入的分栏选中态同步 */
    box.querySelectorAll(".col-item").forEach(function(i){i.classList.toggle("on",i.getAttribute("data-col")===state.col);});
    box.querySelectorAll(".col-item").forEach(function(x){x.onclick=function(){pickCol(x);};});
  }).catch(function(){});
}
function loadTags(){
  fetch(API_BASE+"/public/tags.json").then(function(r){return r.json();}).then(function(j){
    if(!j.ok)return;
    if(!j.data.length){document.getElementById("tagCloud").innerHTML='<span class="tag">暂无标签</span>';return;}
    var html="";
    j.data.forEach(function(t){
      html+='<span class="tag" data-tag="'+esc(t.name)+'"><span class="dot" style="background:'+esc(t.color)+'"></span>'+esc(t.name)+'</span>';
    });
    var box=document.getElementById("tagCloud");
    box.innerHTML=html;
    /* URL 带入的标签选中态同步 */
    box.querySelectorAll(".tag").forEach(function(i){i.classList.toggle("on",i.getAttribute("data-tag")===state.tag);});
    box.querySelectorAll(".tag").forEach(function(x){x.onclick=function(){pickTag(x);};});
  }).catch(function(){});
}
function pickCol(x){
  state.col=x.getAttribute("data-col");state.tag="";state.page=1;
  document.querySelectorAll("#colList .col-item").forEach(function(i){i.classList.toggle("on",i===x);});
  document.querySelectorAll("#tagCloud .tag").forEach(function(t){t.classList.remove("on");});
  loadPosts();
}
function pickTag(x){
  var t=x.getAttribute("data-tag");
  if(state.tag===t){state.tag="";x.classList.remove("on");}
  else{state.tag=t;x.classList.add("on");document.querySelectorAll("#colList .col-item").forEach(function(i){i.classList.remove("on");});}
  state.page=1;loadPosts();
}
document.querySelectorAll(".tab[data-sort]").forEach(function(t){
  t.onclick=function(){state.sort=t.getAttribute("data-sort");state.page=1;
    document.querySelectorAll(".tab[data-sort]").forEach(function(x){x.classList.toggle("on",x===t);});
    loadPosts();};
});
document.getElementById("searchBtn").onclick=function(){
  state.search=document.getElementById("searchInput").value.trim().slice(0,60);
  state.page=1;loadPosts();
};
document.getElementById("searchInput").addEventListener("keydown",function(e){
  if(e.key==="Enter")document.getElementById("searchBtn").click();
});
function loadPosts(){
  var box=document.getElementById("postList");
  box.innerHTML='<div class="loading"><div class="spin"></div></div>';
  var q=API_BASE+"/public/posts.json";
  fetch(q).then(function(r){return r.json();}).then(function(j){
    if(!j.ok){box.innerHTML='<div class="empty"><b>加载失败</b>接口暂不可用，请稍后再试</div>';return;}
    var all=j.data.list.slice();
    /* 关键词搜索：全量列表在前端过滤（Worker 的 posts.json 不支持 search 参数） */
    if(state.search){
      var kw=state.search.toLowerCase();
      all=all.filter(function(p){
        var hay=((p.title||"")+" "+(p.summary||"")+" "+((p.tags||[]).join(" "))).toLowerCase();
        return hay.indexOf(kw)>=0;
      });
    }
    if(state.tag)all=all.filter(function(p){return (p.tags||[]).indexOf(state.tag)>=0;});
    if(state.col)all=all.filter(function(p){return (p.columns||[]).indexOf(state.col)>=0;});
    if(state.sort==="hot")all.sort(function(a,b){return b.views-a.views;});
    state.total=all.length;
    var list=all.slice((state.page-1)*state.size, state.page*state.size);
    if(!list.length){box.innerHTML='<div class="empty"><b>没有匹配的文章</b>换个标签、分栏或关键词试试</div>';}
    else{
      var html="";
      list.forEach(function(p){
        var col1=(p.columns&&p.columns[0])||"";
        var tags=(p.tags||[]).map(function(t){return '<span class="chip">#'+esc(t)+'</span>';}).join("");
        var href=(p.source_file&&p.source_file.indexOf("a_")===0)?p.source_file+(state.col?"?col="+encodeURIComponent(state.col):(state.tag?"?tag="+encodeURIComponent(state.tag):"")):"#";
        var dateOnly=fmtDate(p.created_at);
        html+='<a class="post-card" href="'+href+'">'+
          '<div class="pc-top">'+
            '<span class="pc-cat">'+(col1?'<span class="pc-dot"></span>'+esc(col1):'&nbsp;')+'</span>'+
            '<span class="pc-date">'+dateOnly+'</span>'+
          '</div>'+
          '<h2>'+esc(p.title)+'</h2>'+
          '<p>'+esc(p.summary||"")+'</p>'+
          '<div class="pc-meta">'+
            '<span class="pc-meta-item"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'+ (p.views||0) +'</span>'+
            '<span class="pc-meta-item"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 3 1.7 5.7 4.4 7.2-.1 1-.5 2.4-1.5 3.6-.2.2 0 .6.3.5 2.5-.3 4.4-1.1 5.7-2 .3 0 .7.1 1.1.1 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"/></svg>评论</span>'+
            (tags?'<span class="pc-tags">'+tags+'</span>':'')+
          '</div>'+
        '</a>';
      });
      box.innerHTML=html;
    }
    renderPager();
  }).catch(function(){box.innerHTML='<div class="empty"><b>加载失败</b>请确认离线服务已启动</div>';});
}
function renderPager(){
  var totalPages=Math.max(1,Math.ceil(state.total/state.size));
  var p=document.getElementById("pager");
  if(totalPages<=1){p.innerHTML="";return;}
  p.innerHTML='<button data-p="prev" '+(state.page<=1?"disabled":"")+'>上一页</button>'+
    '<button class="pg-cur">'+state.page+' / '+totalPages+'</button>'+
    '<button data-p="next" '+(state.page>=totalPages?"disabled":"")+'>下一页</button>';
  p.querySelectorAll("button[data-p]").forEach(function(b){
    b.onclick=function(){
      if(b.disabled)return;
      state.page+=b.getAttribute("data-p")==="next"?1:-1;
      loadPosts();window.scrollTo({top:0,behavior:"smooth"});
    };
  });
}
loadToolsNav();loadColumns();loadTags();loadPosts();
</script>
<script>
/* 清逸的博客 · 页面移动端汉堡 */
(function () {
  function build() {
    var header = document.querySelector('header.nav');
    if (!header) return false;
    if (document.querySelector('.mobile-hamburger')) return true;
    var btn = document.createElement('button');
    btn.className = 'mobile-hamburger';
    btn.type = 'button';
    btn.setAttribute('aria-label', '菜单');
    var bar = document.createElement('span');
    btn.appendChild(bar);
    var mask = document.createElement('div');
    mask.className = 'mobile-drawer-mask';
    var drawer = document.createElement('div');
    drawer.className = 'mobile-drawer';
    var logo = document.createElement('div');
    logo.className = 'drawer-logo';
    logo.textContent = '清逸的博客';
    var nav = document.createElement('ul');
    nav.className = 'drawer-nav';
    var srcNav = header.querySelector('.nav-links');
    if (srcNav) {
      srcNav.querySelectorAll('a').forEach(function (a) {
        var li = document.createElement('li');
        var na = document.createElement('a');
        na.href = a.getAttribute('href') || '#';
        na.textContent = a.textContent.trim();
        li.appendChild(na);
        nav.appendChild(li);
      });
    }
    drawer.appendChild(logo);
    drawer.appendChild(nav);
    document.body.appendChild(btn);
    document.body.appendChild(mask);
    document.body.appendChild(drawer);
    function toggle(open) {
      var willOpen = (open === undefined) ? !drawer.classList.contains('open') : open;
      drawer.classList.toggle('open', willOpen);
      mask.classList.toggle('show', willOpen);
      btn.classList.toggle('active', willOpen);
      document.body.style.overflow = willOpen ? 'hidden' : '';
    }
    btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
    mask.addEventListener('click', function () { toggle(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggle(false); });
    return true;
  }
  function start() {
    if (build()) return;
    var t = setInterval(function () { if (build()) clearInterval(t); }, 500);
    setTimeout(function () { clearInterval(t); }, 15000);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else { start(); }
})();
</script>
