# 清逸的博客 · Cloudflare Workers 配置
# 拓扑（新架构，2026-10-13）：
#   主域名 my.qingyi.dpdns.org 由「门户 Worker（qingyi-portal，见 deploy/worker/portal/）」
#   统一聚合 /blog /tool /score 三个 GitHub Pages 子站；博客的公开地址是
#   https://my.qingyi.dpdns.org/blog/。
#
#   本 Worker（blog-server）仍作为博客的动态后端，只接管 /api 与 /api-v1 动态端点
#   （阅读量 + 评论 + 后台），以及 /article/a_*.html 的正文动态渲染。
#
# ⚠ 重要：D1 绑定与路由请在 Cloudflare 控制台手动配置（你已在控制台部署过 blog-server）。
#   本文件只负责把 Worker 代码部署上去，不覆盖控制台已有的绑定与路由。
#   这样可避免：database_id 占位符报错、zone_name 校验失败、路由被意外覆盖。

name = "blog-server"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"

# ---- D1 数据库（阅读量 + 评论）----
# 库已创建：t_blog_qingyi（database_id 见下）。表由 Worker 首次请求自动建（ensureSchema）。
[[d1_databases]]
binding = "DB"
database_name = "t_blog_qingyi"
database_id = "add76dbc-1118-4ec8-9edd-e380b66cbbac"

# ---- 邮件发送 ----
# 发信优先级（sendMail 内自动降级）：
#   ① Cloudflare 原生 Email Service（需在控制台配 send_email binding，当前未启用）
#   ② Resend 第三方邮件（推荐：`npx wrangler secret put RESEND_API_KEY` + `MAIL_FROM`）
#   ③ MAIL_WEBHOOK_URL（自定义转发端点，可选）
#   ④ 都没有 → 骨架分支（接口照常返回，mailConfigured:false）

# ---- 环境变量 ----
# POSTS_URL = 静态文章列表 posts.json 的 raw 地址（阅读量的“真源”元数据）。
#   raw 地址格式：https://raw.githubusercontent.com/<owner>/<repo>/<branch>/<path>
#   ⚠ 路径取决于 api/ 目录在仓库里的位置：
#     · 未重构（api/ 在根目录）     → .../main/api/public/posts.json
#     · 已重构（api/ 移到 site/）   → .../main/site/api/public/posts.json
#   当前按“未重构”填写。若你运行过 scripts/restructure.mjs，把 /api 改成 /site/api。
#
# RAW_API_BASE = 静态 JSON 的 raw 目录基地址（兜底读取用）。
# raw 不经过 GitHub Pages、无自定义域名 301，杜绝回源死循环。
[vars]
POSTS_URL = "https://raw.githubusercontent.com/Kingku-Shawn/www/main/api/public/posts.json"
RAW_API_BASE = "https://raw.githubusercontent.com/Kingku-Shawn/www/main/api"
# 文章 HTML 源目录（补抓正文用）：文章详情页在仓库 article/ 目录下
RAW_ARTICLE_BASE = "https://raw.githubusercontent.com/Kingku-Shawn/www/main/article"
# admin 后台静态文件源（管理员访问 /admin/* 时由 Worker 从这里拉取，Pages 上不部署 admin）
RAW_ADMIN_BASE = "https://raw.githubusercontent.com/Kingku-Shawn/www/main/admin"
# 静态源（文章详情页 D1 无数据时回退 + 静态资源反向代理）：项目 Pages 裸源
STATIC_ORIGIN = "https://kingku-shawn.github.io/www"
# 自定义域名（博客公开地址，含 /blog 子路径；用于 301 Location 改写破死循环 + SEO 生成绝对 URL）
CUSTOM_HOST = "my.qingyi.dpdns.org/blog"
# 预设管理员用户名（公开无妨）。该用户名注册时自动成为管理员。
ADMIN_USER = "kingkushawn"
