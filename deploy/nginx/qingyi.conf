# 本地 Nginx 反代配置（门户 / API / Ollama / 宝塔）
# 可整段复制到宝塔「网站→站点→配置文件」，或放到独立 Nginx 的 conf.d/。
# 说明：my.qingyi.dpdns.org 门户默认由 Cloudflare 边缘的 portal Worker 提供，
#       只有在「本地渲染门户」时才需要把 my 指向本机 80 并启用下面第一个 server。
# 只替换：server_name、root、日志路径、以及 3000/4000/31843 等实际端口。

# ---- 门户（可选：本地渲染时启用）----
server {
    listen 80;
    server_name my.qingyi.dpdns.org;

    root /var/www/qingyi-portal;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ $uri.html $uri/index.html /index.html;
    }

    # 站点自身动态接口：反代到本地 API（若门户/博客要调本地 API）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot|mp3|ogg|wav)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-store";
    }
}

# ---- 前后端 API（本机 3000）----
server {
    listen 80;
    server_name api.qingyi.dpdns.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 8m;
    }
}

# ---- Ollama 鉴权代理（本机 4000）----
server {
    listen 80;
    server_name ollama.qingyi.dpdns.org;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图文推理可能较慢，超时放宽
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 32m;
    }
}

# ---- 宝塔面板（本机 31843，按实际端口改）----
server {
    listen 80;
    server_name bt.qingyi.dpdns.org;

    location / {
        proxy_pass http://127.0.0.1:31843;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 600s;
    }
}
