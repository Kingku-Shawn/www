# ollama.qingyi.dpdns.org 前端代理 Worker
# 作用：前端只调本 Worker，不直接碰 ollaguard 的 Bearer Token；
#       Worker 持有 OLLAMA_API_KEY，转发到本地 ollaguard（经 Tunnel）。
#
# 部署：
#   cd deploy/worker/ollama-proxy
#   wrangler secret put OLLAMA_API_KEY     # 填入 setup-ollaguard.sh 生成的普通 key
#   wrangler deploy
# 然后把 ollama.qingyi.dpdns.org 指向本 Worker（或走 Tunnel → 本机 4000 由 Nginx 反代）。

name = "qingyi-ollama-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# ollaguard 代理地址（Cloudflare Tunnel 把 ollama.qingyi.dpdns.org 反代到本机 4000；
# 本 Worker 与 ollama 域名不同，故直接回源本机 4000 的对外可访问地址）。
# 若 Worker 与 ollaguard 不在同一内网，改用公网可访问的 ollama 域名/地址。
OLLAMA_UPSTREAM = "http://localhost:4000"
# 默认模型（前端未指定时使用）
DEFAULT_MODEL = "granite3.2-vision:2b"
# 允许的模型白名单（逗号分隔；空则不限）
ALLOWED_MODELS = "granite3.2-vision:2b,qwen3-vl:2b"
# 简单 CORS 允许的源（* 表示允许所有；生产建议改成 my.qingyi.dpdns.org）
CORS_ORIGIN = "*"
