}
/* FR-X12 深色模式：跟随系统 + 手动覆盖（html[data-theme]） */

}
:root[data-theme="dark"]{
  --ink:#e2e8f0; --ink2:#94a3b8; --ink3:#64748b;
  --bg:#0b1220; --card:#111a2c; --line:rgba(148,163,184,.14);

}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
a{text-decoration:none;color:inherit}
.ambient{position:fixed;top:-180px;left:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle at center,rgba(37,99,235,.16),transparent 65%);z-index:0;pointer-events:none}
.ambient.r{top:auto;bottom:-200px;right:-140px;left:auto;width:560px;height:560px;background:radial-gradient(circle at center,rgba(14,165,233,.14),transparent 65%)}

/* 导航 */
.nav{position:fixed;top:0;left:0;right:0;height:68px;z-index:50;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1200px;margin:0 auto;height:100%;display:flex;align-items:center;gap:28px;padding:0 24px}
.logo{font-size:20px;font-weight:800;letter-spacing:.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav-links a{display:block;padding:8px 14px;border-radius:999px;font-size:14px;color:var(--ink2);transition:.2s}
.nav-links a:hover{color:var(--primary);background:rgba(37,99,235,.08)}
.nav-links a.on{color:#fff;background:var(--grad);font-weight:600}
.nav-user{font-size:14px;color:var(--ink2);white-space:nowrap}
.nav-user a{color:var(--primary);font-weight:600}
.nav-user .btn-exit{color:var(--ink3);margin-left:10px;cursor:pointer;border:0;background:none;font-size:13px}

/* Hero（参考 soulsoft/blog：浅色渐变底 + 左文案右统计卡） */

.hero-card{position:relative;border-radius:28px;padding:52px 56px;color:var(--ink);overflow:hidden;display:grid;grid-template-columns:1fr 280px;gap:40px;align-items:center;background:linear-gradient(120deg,#eef4ff 0%,#f5f9ff 45%,#e8f6fd 100%);border:1px solid rgba(37,99,235,.10);box-shadow:0 20px 50px rgba(37,99,235,.10)}
.hero-card::before{content:"";position:absolute;top:-90px;right:-70px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.10),transparent 65%);pointer-events:none}
.hero-main{position:relative;z-index:1}
.hero-card h1{font-size:40px;font-weight:800;line-height:1.35;color:#0f172a}
.hero-card p{font-size:16px;color:var(--ink2);margin-top:14px;max-width:520px;line-height:1.8}
.hero-card .hero-badges{position:relative;z-index:1;margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.hero-card .hero-badges span{background:rgba(255,255,255,.75);border:1px solid rgba(37,99,235,.18);color:var(--primary);padding:5px 14px;border-radius:999px;font-size:12.5px;font-weight:600}
.hero-stats{position:relative;z-index:1;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border:1px solid rgba(37,99,235,.12);border-radius:16px;padding:20px 22px;box-sizing:border-box}
.hs-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(15,23,42,.08)}
.hs-row:last-child{border-bottom:0;padding-bottom:0}
.hs-label{font-size:12.5px;color:var(--ink2)}
.hs-value{font-size:18px;font-weight:800;color:var(--primary)}

/* 布局 */
.layout{max-width:1200px;margin:28px auto 0;padding:0 24px;display:grid;grid-template-columns:300px 1fr;gap:26px;position:relative;z-index:1}

/* 卡片通用 */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.05)}
.card h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--grad)}
.side{display:flex;flex-direction:column;gap:22px}
.side .sticky{position:sticky;top:92px;display:flex;flex-direction:column;gap:22px}

/* 侧栏个人信息 */
.profile .p-name{font-size:18px;font-weight:800}
.profile .p-desc{color:var(--ink2);font-size:13.5px;margin-top:8px;line-height:1.7}
.profile .p-meta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.profile .p-meta span{font-size:12px;color:var(--ink2);background:var(--chip-bg);padding:4px 12px;border-radius:999px}

/* 标签云 */
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px;background:transparent}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--ink2);background:var(--chip-bg);border:1px solid transparent;cursor:pointer;transition:.18s;user-select:none}
.tag .dot{width:8px;height:8px;border-radius:50%;flex:none}
.tag:hover{color:var(--primary);border-color:rgba(37,99,235,.35);background:rgba(37,99,235,.06)}
.tag.on{color:#fff;background:var(--grad);border-color:transparent}

/* 标签云 */

/* 分栏列表 */
.col-list{display:flex;flex-direction:column;gap:4px}
.col-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:12px;font-size:14px;color:var(--ink2);cursor:pointer;transition:.15s}
.col-item:hover{background:var(--chip-bg);color:var(--primary)}
.col-item.on{background:rgba(37,99,235,.08);color:var(--primary);font-weight:600}
.col-item .cnt{font-size:12px;color:var(--ink3)}

/* 内容区 */
.content{min-width:0}
.sort-tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{padding:9px 20px;border-radius:999px;font-size:14px;color:var(--ink2);cursor:pointer;transition:.18s;background:var(--card);border:1px solid var(--line)}
.tab:hover{color:var(--primary)}
.tab.on{color:#fff;background:var(--grad);border-color:transparent}
/* 文章卡片（参考 soulsoft/blog：分类圆点行 + 蓝标题 + 摘要 + 元信息胶囊 + 右上日期） */
.post-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:16px;transition:.2s;cursor:pointer;display:block;position:relative}
.post-card:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(15,23,42,.09);border-color:rgba(37,99,235,.25)}
.pc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pc-cat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:600}
.pc-dot{width:8px;height:8px;border-radius:50%;background:var(--grad);flex:none}
.pc-date{font-size:12px;color:var(--ink3)}
.post-card h2{font-size:18px;font-weight:700;line-height:1.5;color:var(--primary)}
.post-card:hover h2{text-decoration:underline;text-underline-offset:3px}
.post-card p{color:var(--ink2);font-size:13.5px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-meta{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.pc-meta-item{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3)}
.pc-meta-item svg{opacity:.75}
.empty{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:56px 24px;text-align:center;color:var(--ink3)}
.empty b{display:block;font-size:16px;color:var(--ink2);margin-bottom:6px}
.pager{display:flex;justify-content:center;gap:10px;margin-top:24px}
.pager button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:12px;padding:8px 16px;font-size:14px;cursor:pointer;transition:.15s}
.pager button:hover{color:var(--primary);border-color:rgba(37,99,235,.4)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .pg-cur{background:var(--grad);color:#fff;border-color:transparent}

/* 工具区 */
.tools-sec{max-width:1200px;margin:34px auto 0;padding:0 24px;position:relative;z-index:1}
.tools-sec h2{font-size:20px;font-weight:800;margin-bottom:18px}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tool-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;transition:.2s;display:block;position:relative;overflow:hidden}
.tool-card:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(15,23,42,.09)}
.tool-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad)}
.tool-card .t-name{font-size:16px;font-weight:700}
.tool-card .t-desc{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.6}
.tool-card .t-go{margin-top:14px;font-size:13px;color:var(--primary);font-weight:600}

/* 页脚 */
footer{margin-top:56px;padding:28px 24px;text-align:center;color:var(--ink3);font-size:13px;border-top:1px solid var(--line)}
.loading{display:flex;justify-content:center;padding:48px 0;color:var(--ink3)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(37,99,235,.15);border-top-color:var(--primary);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* 移动端适配：汉堡侧边菜单 */
  .mobile-hamburger, .mobile-drawer, .mobile-drawer-mask { display: none; }

@media (max-width: 900px) {

        '</div></div>';

      if(un&&m){un.onclick=function(ev){ev.stopPropagation();m.style.display=m.style.display==="none"?"block":"none";};document.addEventListener("click",function(ev){if(!b.contains(ev.target))m.style.display="none";});}

<script>
var API_BASE = "/api";
var state = {tag:"", tags:[], col:"", page:1, size:6, sort:"latest", total:0};

function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmtDate(s){if(!s)return "";return String(s).slice(0,10);}
function loadToolsNav(){
  fetch(API_BASE+"/tools.json").then(function(r){return r.json();}).then(function(j){
    if(!j.ok)return;
    var on={};j.data.forEach(function(t){on[t.key]=1;});
    document.querySelectorAll("#navLinks a[data-tool]").forEach(function(a){
      if(!on[a.getAttribute("data-tool")])a.style.display="none";
    });
  }).catch(function(){});
}
function loadColumns(){
  fetch(API_BASE+"/public/columns.json").then(function(r){return r.json();}).then(function(j){
    if(!j.ok)return;
    var html='<span class="col-item on" data-col="">全部<span class="cnt">'+j.data.reduce(function(a,c){return a+c.cnt;},0)+'</span></span>';
    j.data.forEach(function(c){
      html+='<span class="col-item" data-col="'+esc(c.name)+'">'+esc(c.name)+'<span class="cnt">'+c.cnt+'</span></span>';
    });
    var box=document.getElementById("colList");
    box.innerHTML=html;
    box.querySelectorAll(".col-item").forEach(function(x){x.onclick=function(){pickCol(x);};});
  }).catch(function(){});
}
function loadTags(){
  fetch(API_BASE+"/public/tags.json").then(function(r){return r.json();}).then(function(j){
    if(!j.ok)return;
    if(!j.data.length){document.getElementById("tagCloud").innerHTML='<span class="tag">暂无标签</span>';return;}
    var html="";
    j.data.forEach(function(t){
      html+='<span class="tag" data-tag="'+esc(t.name)+'"><span class="dot" style="background:'+esc(t.color)+'"></span>'+esc(t.name)+'</span>';
    });
    var box=document.getElementById("tagCloud");
    box.innerHTML=html;
    box.querySelectorAll(".tag").forEach(function(x){x.onclick=function(){pickTag(x);};});
  }).catch(function(){});
}
function pickCol(x){
  state.col=x.getAttribute("data-col");state.tags=[];state.page=1;
  document.querySelectorAll("#colList .col-item").forEach(function(i){i.classList.toggle("on",i===x);});
  document.querySelectorAll("#tagCloud .tag").forEach(function(t){t.classList.remove("on");});
  loadPosts();
}
function pickTag(x){
  var t=x.getAttribute("data-tag");
  if(!state.tags)state.tags=[];
  var i=state.tags.indexOf(t);
  if(i>=0){state.tags.splice(i,1);x.classList.remove("on");}
  else{state.tags.push(t);x.classList.add("on");}
  // 多标签模式下清除分栏选中
  if(state.tags.length){state.col="";document.querySelectorAll("#colList .col-item").forEach(function(c){c.classList.remove("on");});}
  state.page=1;loadPosts();
}
document.querySelectorAll(".tab[data-sort]").forEach(function(t){
  t.onclick=function(){state.sort=t.getAttribute("data-sort");state.page=1;
    document.querySelectorAll(".tab[data-sort]").forEach(function(x){x.classList.toggle("on",x===t);});
    loadPosts();};
});
function loadPosts(){
  var box=document.getElementById("postList");
  box.innerHTML='<div class="loading"><div class="spin"></div></div>';
  var q=API_BASE+"/public/posts.json";
  fetch(q).then(function(r){return r.json();}).then(function(j){
    if(!j.ok){box.innerHTML='<div class="empty"><b>加载失败</b>接口暂不可用，请稍后再试</div>';return;}
    var all=j.data.list.slice();
    if(state.tags&&state.tags.length)all=all.filter(function(p){return state.tags.every(function(t){return (p.tags||[]).indexOf(t)>=0;});});
    if(state.col)all=all.filter(function(p){return (p.columns||[]).indexOf(state.col)>=0;});
    if(state.sort==="hot")all.sort(function(a,b){return b.views-a.views;});
    state.total=all.length;
    /* hero 统计卡：全量文章数 + 总阅读量 */
    try{
      var rawAll=j.data.list||[];
      var totalViews=0;
      rawAll.forEach(function(p){totalViews+=(p.views||0);});
      var elT=document.getElementById("hsTotal"),elV=document.getElementById("hsViews");
      if(elT)elT.textContent=rawAll.length;
      if(elV)elV.textContent=totalViews;
    }catch(e){}
    var list=all.slice((state.page-1)*state.size, state.page*state.size);
    if(!list.length){box.innerHTML='<div class="empty"><b>没有匹配的文章</b>换个标签或分栏试试</div>';}
    else{
      var html="";
      list.forEach(function(p){
        var col1=(p.columns&&p.columns[0])||"";
        var tags=(p.tags||[]).map(function(t){return '<span class="chip">#'+esc(t)+'</span>';}).join("");
        var href=(p.source_file&&p.source_file.indexOf("a_")===0)?("article/"+p.source_file+(state.col?"?col="+encodeURIComponent(state.col):"")):"#";
        var dateOnly=fmtDate(p.created_at);
        html+='<a class="post-card" href="'+href+'">'+
          '<div class="pc-top">'+
            '<span class="pc-cat">'+(col1?'<span class="pc-dot"></span>'+esc(col1):'&nbsp;')+'</span>'+
            '<span class="pc-date">'+dateOnly+'</span>'+
          '</div>'+
          '<h2>'+esc(p.title)+'</h2>'+
          '<p>'+esc(p.summary||"")+'</p>'+
          '<div class="pc-meta">'+
            '<span class="pc-meta-item"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'+ (p.views||0) +'</span>'+
            '<span class="pc-meta-item"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 3 1.7 5.7 4.4 7.2-.1 1-.5 2.4-1.5 3.6-.2.2 0 .6.3.5 2.5-.3 4.4-1.1 5.7-2 .3 0 .7.1 1.1.1 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"/></svg>评论</span>'+
          '</div>'+
        '</a>';
      });
      box.innerHTML=html;
    }
    renderPager();
  }).catch(function(){box.innerHTML='<div class="empty"><b>加载失败</b>请确认离线服务已启动</div>';});
}
function renderPager(){
  var totalPages=Math.max(1,Math.ceil(state.total/state.size));
  var p=document.getElementById("pager");
  if(totalPages<=1){p.innerHTML="";return;}
  p.innerHTML='<button data-p="prev" '+(state.page<=1?"disabled":"")+'>上一页</button>'+
    '<button class="pg-cur">'+state.page+' / '+totalPages+'</button>'+
    '<button data-p="next" '+(state.page>=totalPages?"disabled":"")+'>下一页</button>';
  p.querySelectorAll("button[data-p]").forEach(function(b){
    b.onclick=function(){
      if(b.disabled)return;
      state.page+=b.getAttribute("data-p")==="next"?1:-1;
      loadPosts();window.scrollTo({top:document.querySelector(".content").offsetTop-100,behavior:"smooth"});
    };
  });
}
function loadTools(){
  var box=document.getElementById("toolsGrid");
  fetch(API_BASE+"/tools.json").then(function(r){return r.json();}).then(function(j){
    if(!j.ok||!j.data.length){box.innerHTML='<div class="empty"><b>暂无工具</b></div>';return;}
    var tools=j.data.filter(function(t){return t.enabled!==false;});
    if(!tools.length){box.innerHTML='<div class="empty"><b>暂无工具</b></div>';return;}
    var html="";
    tools.forEach(function(t){
      html+='<a class="tool-card" href="'+esc(t.path)+'"><div class="t-name">'+esc(t.name)+'</div><div class="t-desc">'+esc(t.desc||"")+'</div><div class="t-go">立即体验 →</div></a>';
    });
    box.innerHTML=html;
  }).catch(function(){box.innerHTML="";});
}
loadToolsNav();loadColumns();loadTags();loadPosts();loadTools();
</script>
<script>
/* 清逸的博客 · 页面移动端汉堡 */
(function () {
  function build() {
    var header = document.querySelector('header.nav');
    if (!header) return false;
    if (document.querySelector('.mobile-hamburger')) return true;
    var btn = document.createElement('button');
    btn.className = 'mobile-hamburger';
    btn.type = 'button';
    btn.setAttribute('aria-label', '菜单');
    var bar = document.createElement('span');
    btn.appendChild(bar);
    var mask = document.createElement('div');
    mask.className = 'mobile-drawer-mask';
    var drawer = document.createElement('div');
    drawer.className = 'mobile-drawer';
    var logo = document.createElement('div');
    logo.className = 'drawer-logo';
    logo.textContent = '清逸的博客';
    var nav = document.createElement('ul');
    nav.className = 'drawer-nav';
    var srcNav = header.querySelector('.nav-links');
    if (srcNav) {
      srcNav.querySelectorAll('a').forEach(function (a) {
        var li = document.createElement('li');
        var na = document.createElement('a');
        na.href = a.getAttribute('href') || '#';
        na.textContent = a.textContent.trim();
        li.appendChild(na);
        nav.appendChild(li);
      });
    }
    drawer.appendChild(logo);
    drawer.appendChild(nav);
    document.body.appendChild(btn);
    document.body.appendChild(mask);
    document.body.appendChild(drawer);
    function toggle(open) {
      var willOpen = (open === undefined) ? !drawer.classList.contains('open') : open;
      drawer.classList.toggle('open', willOpen);
      mask.classList.toggle('show', willOpen);
      btn.classList.toggle('active', willOpen);
      document.body.style.overflow = willOpen ? 'hidden' : '';
    }
    btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
    mask.addEventListener('click', function () { toggle(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggle(false); });
    return true;
  }
  function start() {
    if (build()) return;
    var t = setInterval(function () { if (build()) clearInterval(t); }, 500);
    setTimeout(function () { clearInterval(t); }, 15000);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else { start(); }
})();
</script>
