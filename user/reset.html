<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>重置密码 - 清逸的博客</title>
<link rel="stylesheet" href="/soulsoft-tools.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f6f8fb;color:#1f2430;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .nav{position:fixed;top:0;left:0;right:0;height:58px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid #e6ebf2;z-index:50}
  .nav-in{max-width:1100px;height:100%;margin:0 auto;display:flex;align-items:center;gap:22px;padding:0 20px}
  .nav .logo{font-size:18px;font-weight:700;color:#2563eb;text-decoration:none}
  .nav-links{display:flex;gap:18px;flex:1}
  .nav-links a{color:#475569;text-decoration:none;font-size:14px}
  .nav-user a{color:#2563eb;text-decoration:none;font-size:14px}
  .wrap{max-width:520px;margin:0 auto;padding:110px 20px 60px}
  .card{background:#fff;border:1px solid #e6ebf2;border-radius:18px;padding:34px 30px;box-shadow:0 12px 34px rgba(15,23,42,.07)}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:#94a3b8;font-size:13px;margin-bottom:22px}
  label{display:block;font-size:13px;font-weight:600;color:#334155;margin:14px 0 6px}
  input{width:100%;padding:11px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;font-family:inherit}
  input:focus{border-color:#2563eb}
  button{width:100%;margin-top:20px;padding:12px 0;border:0;border-radius:11px;background:#2563eb;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13.5px;display:none;line-height:1.7}
  .msg.ok{display:block;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
  .msg.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
  .foot{margin-top:18px;text-align:center;font-size:13px;color:#94a3b8}
  .foot a{color:#2563eb;text-decoration:none}
  .tip{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:10px 13px;font-size:12.5px;color:#64748b;margin-top:16px}
  @media(max-width:720px){.nav-links{display:none}.card{padding:26px 18px}.wrap{padding:90px 14px 40px}}
  /* ---- FR-X12 深色模式 ---- */
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]) body{background:#0b1220;color:#e2e8f0}
    html:not([data-theme="light"]) .nav{background:rgba(17,26,44,.92);border-color:#1e293b}
    html:not([data-theme="light"]) .card{background:#111a2c;border-color:#1e293b}
    html:not([data-theme="light"]) label{color:#94a3b8}
    html:not([data-theme="light"]) input{background:#0f172a;border-color:#1e293b;color:#e2e8f0}
    html:not([data-theme="light"]) .nav-links a{color:#94a3b8}
    html:not([data-theme="light"]) .nav-user a{color:#60a5fa}
    html:not([data-theme="light"]) .foot a{color:#60a5fa}
  }
  html[data-theme="dark"] body{background:#0b1220;color:#e2e8f0}
  html[data-theme="dark"] .nav{background:rgba(17,26,44,.92);border-color:#1e293b}
  html[data-theme="dark"] .card{background:#111a2c;border-color:#1e293b}
  html[data-theme="dark"] label{color:#94a3b8}
  html[data-theme="dark"] input{background:#0f172a;border-color:#1e293b;color:#e2e8f0}
  html[data-theme="dark"] .nav-links a{color:#94a3b8}
  html[data-theme="dark"] .nav-user a{color:#60a5fa}
  html[data-theme="dark"] .foot a{color:#60a5fa}
  .theme-toggle{width:auto;margin:0 0 0 10px;border:1px solid rgba(148,163,184,.45);background:rgba(148,163,184,.14);color:#475569;cursor:pointer;font-size:13px;padding:5px 12px;border-radius:999px}
  html[data-theme="dark"] .theme-toggle{color:#cbd5e1;border-color:#334155;background:#1e293b}
</style>
</head>
<body>
<header class="nav">
  <div class="nav-in" id="navIn">
    <a class="logo" href="/index.html">清逸的博客</a>
    <nav class="nav-links" id="navLinks">
      <a href="/index.html">首页</a>
      <a href="/article/index.html">文章</a>
      <a href="/aboutme/index.html">关于我</a>
      <a href="/search/index.html" data-search="1">搜索</a>
    </nav>
    <div class="nav-user" id="navUser"><a href="/user/login.html">登录</a></div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="切换深浅色" title="切换深浅色">🌙 深色</button>
  </div>
</header>
<script>
(function(){var b=document.getElementById("themeToggle");if(!b)return;
function apply(){var s=null;try{s=localStorage.getItem("blog_theme")}catch(e){}
var h=document.documentElement;var d=s?s==="dark":(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
if(s)h.setAttribute("data-theme",s);else h.removeAttribute("data-theme");h.style.colorScheme=d?"dark":"light";b.textContent=d?"☀️ 浅色":"🌙 深色";}
b.onclick=function(){var h=document.documentElement;var nd=h.getAttribute("data-theme")==="dark"||(!h.getAttribute("data-theme")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
var n=nd?"light":"dark";h.setAttribute("data-theme",n);h.style.colorScheme=n;try{localStorage.setItem("blog_theme",n)}catch(e){}b.textContent=n==="dark"?"☀️ 浅色":"🌙 深色";};apply();})();
</script>

<div class="wrap">
  <div class="card">
    <h1>重置密码</h1>
    <div class="sub">粘贴一次性重置令牌（30 分钟内有效，用过即失效），设置新密码</div>

    <label for="token">重置令牌</label>
    <input id="token" type="text" placeholder="48 位十六进制字符串" autocomplete="one-time-code" maxlength="120">

    <label for="pwd">新密码（至少 6 位）</label>
    <input id="pwd" type="password" autocomplete="new-password" maxlength="72">

    <label for="pwd2">确认新密码</label>
    <input id="pwd2" type="password" autocomplete="new-password" maxlength="72">

    <button id="btn" type="button">重置密码</button>
    <div class="msg" id="msg"></div>

    <div class="tip">重置成功后，该账号的<strong>全部登录会话会被踢出</strong>，需要用新密码重新登录。</div>
    <div class="foot"><a href="/user/forgot.html">没有令牌？重新生成</a> · <a href="/user/login.html">返回登录</a></div>
  </div>
</div>

<script>
  (function () {
    var msg = document.getElementById("msg");
    var btn = document.getElementById("btn");
    function show(text, ok) {
      msg.className = "msg " + (ok ? "ok" : "err");
      msg.innerHTML = text;
    }
    // 支持从邮件链接带 token 进来：/user/reset.html?token=xxx
    try {
      var t = new URLSearchParams(location.search).get("token");
      if (t) document.getElementById("token").value = t;
    } catch (e) {}

    btn.addEventListener("click", function () {
      var token = document.getElementById("token").value.trim();
      var p1 = document.getElementById("pwd").value;
      var p2 = document.getElementById("pwd2").value;
      if (!token) { show("请填写重置令牌", false); return; }
      if (p1.length < 6) { show("密码至少 6 位", false); return; }
      if (p1 !== p2) { show("两次输入的密码不一致", false); return; }
      btn.disabled = true;
      btn.textContent = "提交中…";
      fetch("/api/auth/password/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, password: p1 })
      }).then(function (r) { return r.json(); }).then(function (j) {
        btn.disabled = false;
        btn.textContent = "重置密码";
        if (j && j.ok) {
          show((j.msg || "密码已重置") + '<br><br><a href="/user/login.html">前往登录 →</a>', true);
        } else {
          show((j && j.msg) || "重置失败", false);
        }
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = "重置密码";
        show("网络异常，请稍后再试", false);
      });
    });
  })();
</script>
<script src="/js/header-fix.js"></script>
</body>
</html>
