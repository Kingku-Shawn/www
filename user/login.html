<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #24292f; font-size: 14px; }
  a { color: #2f81f7; text-decoration: none; }
  a:hover { text-decoration: underline; }


  /* 登录卡片 */
  .login-wrap { display: flex; align-items: flex-start; justify-content: center; padding: 70px 16px 90px; }
  .card { width: 420px; max-width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.05); overflow: hidden; }
  .tabs { display: flex; border-bottom: 1px solid #e5e7eb; }
  .tab { flex: 1; text-align: center; padding: 15px 0; cursor: pointer; color: #57606a; font-size: 15px; font-weight: 600; border-bottom: 2px solid transparent; }
  .tab.on { color: #2f81f7; border-bottom-color: #2f81f7; }
  .form-area { padding: 30px 34px 34px; }
  .form-item { margin-bottom: 18px; }
  .form-item label { display: block; color: #57606a; margin-bottom: 7px; font-size: 13px; }
  .form-item input { width: 100%; padding: 11px 13px; border: 1px solid #d0d7de; border-radius: 8px; font-size: 14px; outline: none; color: #24292f; }
  .form-item input:focus { border-color: #2f81f7; box-shadow: 0 0 0 3px rgba(47,129,247,.12); }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2f81f7; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #1f6feb; }
  .btn:disabled { background: #a5c8f5; cursor: not-allowed; }
  .err { min-height: 20px; margin-top: 10px; color: #cf222e; font-size: 13px; }
  .ok { min-height: 20px; margin-top: 10px; color: #1a7f37; font-size: 13px; }
  .tip { margin-top: 18px; padding: 12px 14px; background: #f6f8fa; border: 1px dashed #d0d7de; border-radius: 8px; color: #57606a; font-size: 12.5px; line-height: 1.9; }
  .tip b { color: #24292f; }
  .hide { display: none; }
  .logged-panel { text-align: center; padding: 50px 34px; }
  .logged-panel .ico { font-size: 44px; margin-bottom: 14px; }
  .logged-panel h3 { margin-bottom: 10px; }
  .logged-panel p { color: #57606a; margin-bottom: 24px; }
  .logged-panel .btn { width: auto; padding: 10px 34px; }
  .site-footer { text-align: center; padding: 26px 0; color: #8c959f; font-size: 12.5px; }

  /* 移动端适配：汉堡侧边菜单 */
  .mobile-hamburger, .mobile-drawer, .mobile-drawer-mask { display: none; }

  @media (max-width: 860px) {
    .nav-in { padding: 0 12px; }
    .nav-links { display: none !important; }
    .nav-user { display: none !important; }
    .mobile-hamburger {
      position: fixed; top: 9px; right: 12px; z-index: 1500;
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border: none; background: #f0f3f6;
      border-radius: 12px; cursor: pointer; padding: 0;
    }
    .mobile-hamburger span { display: block; width: 18px; height: 2px; background: #24292f; border-radius: 2px; position: relative; }
    .mobile-hamburger span::before, .mobile-hamburger span::after {
      content: ""; position: absolute; left: 0; width: 18px; height: 2px;
      background: #24292f; border-radius: 2px;
    }
    .mobile-hamburger span::before { top: -5px; }
    .mobile-hamburger span::after { top: 5px; }
    .mobile-hamburger.active span { background: transparent; }
    .mobile-hamburger.active span::before { top: 0; transform: rotate(45deg); }
    .mobile-hamburger.active span::after { top: 0; transform: rotate(-45deg); }
    .mobile-drawer {
      display: block; position: fixed; top: 0; right: 0; height: 100%;
      width: 264px; max-width: 82vw; background: #fff; z-index: 2100;
      transform: translateX(100%); transition: transform .26s ease;
      box-shadow: -10px 0 34px rgba(15,23,42,.14); padding: 22px 16px;
      overflow-y: auto; box-sizing: border-box;
    }
    .mobile-drawer.open { transform: translateX(0); }
    .mobile-drawer .drawer-logo { font-size: 18px; font-weight: 800; color: #2f81f7; padding: 0 8px 14px; border-bottom: 1px solid #e5e7eb; margin-bottom: 12px; }
    .mobile-drawer .drawer-nav { list-style: none; margin: 0; padding: 0; }
    .mobile-drawer .drawer-nav li { margin: 0 0 2px; }
    .mobile-drawer .drawer-nav a { display: block; padding: 11px 14px; border-radius: 12px; color: #24292f; font-size: 15px; font-weight: 600; text-decoration: none; }
    .mobile-drawer .drawer-nav a:hover { background: #f0f3f6; color: #2f81f7; }
    .mobile-drawer-mask {
      display: block; position: fixed; inset: 0; background: rgba(15,23,42,.42);
      z-index: 2000; opacity: 0; visibility: hidden; transition: opacity .25s ease;
    }
    .mobile-drawer-mask.show { opacity: 1; visibility: visible; }
  }

  /* 统一顶栏：与全站 soulsoft 白玻璃顶栏一致 */
  header.nav {
    background: rgba(255,255,255,.82) !important;
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid #e4e9f0 !important;
    box-shadow: 0 8px 28px rgba(15,23,42,.05) !important;
    height: 58px !important;
    padding: 0 20px;
    box-sizing: border-box;
  }
  .nav-in {
    max-width: 1200px !important;
    gap: 26px !important;
  }
  .nav .logo {
    color: #2563eb !important;
    font-size: 19px !important;
    font-weight: 800 !important;
    letter-spacing: .5px;
    text-decoration: none !important;
    white-space: nowrap;
  }
  .nav-links a {
    color: #5a6a7a !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    padding: 7px 12px !important;
    border-radius: 999px !important;
    text-decoration: none !important;
    transition: all .15s ease;
    white-space: nowrap;
  }
  .nav-links a:hover, .nav-links a.on {
    color: #2563eb !important;
    background: rgba(37,99,235,.08) !important;
  }
  .nav-user a {
    display: inline-flex !important;
    align-items: center;
    gap: 6px;
    color: #2563eb !important;
    background: #f4f8ff !important;
    border: 1px solid #e4e9f0 !important;
    padding: 7px 16px !important;
    border-radius: 999px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    text-decoration: none !important;
    box-shadow: 0 6px 16px rgba(15,23,42,.05);
    transition: all .15s ease;
  }
  .nav-user a:hover {
    background: #e9f2ff !important;
    transform: translateY(-1px);
  }

  /* ---- FR-X12 深色模式（跟随系统 + html[data-theme] 手动覆盖）---- */
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) body { background: #0b1220; color: #e2e8f0; }
    html:not([data-theme="light"]) .card { background: #111a2c; border-color: #1e293b; }
    html:not([data-theme="light"]) .tabs { border-color: #1e293b; }
    html:not([data-theme="light"]) .tab { color: #94a3b8; }
    html:not([data-theme="light"]) .tab.on { color: #60a5fa; border-bottom-color: #60a5fa; }
    html:not([data-theme="light"]) .form-item label { color: #94a3b8; }
    html:not([data-theme="light"]) .form-item input { background: #0f172a; border-color: #1e293b; color: #e2e8f0; }
    html:not([data-theme="light"]) .tip { background: #16223a; border-color: #1e293b; color: #94a3b8; }
    html:not([data-theme="light"]) .tip b { color: #e2e8f0; }
    html:not([data-theme="light"]) header.nav { background: rgba(17,26,44,.9) !important; border-bottom: 1px solid #1e293b !important; }
    html:not([data-theme="light"]) .nav-links a { color: #94a3b8 !important; }
    html:not([data-theme="light"]) .mobile-hamburger { background: #1e293b; }
    html:not([data-theme="light"]) .mobile-hamburger span,
    html:not([data-theme="light"]) .mobile-hamburger span::before,
    html:not([data-theme="light"]) .mobile-hamburger span::after { background: #e2e8f0; }
    html:not([data-theme="light"]) .mobile-drawer { background: #111a2c; }
    html:not([data-theme="light"]) .mobile-drawer .drawer-nav a { color: #e2e8f0; }
    html:not([data-theme="light"]) .mobile-drawer .drawer-nav a:hover { background: #1e293b; }
    html:not([data-theme="light"]) .mobile-drawer .drawer-logo { color: #60a5fa; border-color: #1e293b; }
  }
  html[data-theme="dark"] body { background: #0b1220; color: #e2e8f0; }
  html[data-theme="dark"] .card { background: #111a2c; border-color: #1e293b; }
  html[data-theme="dark"] .tabs { border-color: #1e293b; }
  html[data-theme="dark"] .tab { color: #94a3b8; }
  html[data-theme="dark"] .tab.on { color: #60a5fa; border-bottom-color: #60a5fa; }
  html[data-theme="dark"] .form-item label { color: #94a3b8; }
  html[data-theme="dark"] .form-item input { background: #0f172a; border-color: #1e293b; color: #e2e8f0; }
  html[data-theme="dark"] .tip { background: #16223a; border-color: #1e293b; color: #94a3b8; }
  html[data-theme="dark"] .tip b { color: #e2e8f0; }
  html[data-theme="dark"] header.nav { background: rgba(17,26,44,.9) !important; border-bottom: 1px solid #1e293b !important; }
  html[data-theme="dark"] .nav-links a { color: #94a3b8 !important; }
  html[data-theme="dark"] .mobile-hamburger { background: #1e293b; }
  html[data-theme="dark"] .mobile-hamburger span,
  html[data-theme="dark"] .mobile-hamburger span::before,
  html[data-theme="dark"] .mobile-hamburger span::after { background: #e2e8f0; }
  html[data-theme="dark"] .mobile-drawer { background: #111a2c; }
  html[data-theme="dark"] .mobile-drawer .drawer-nav a { color: #e2e8f0; }
  html[data-theme="dark"] .mobile-drawer .drawer-nav a:hover { background: #1e293b; }
  html[data-theme="dark"] .mobile-drawer .drawer-logo { color: #60a5fa; border-color: #1e293b; }

  /* 主题切换按钮 */
  .theme-toggle { border: 1px solid rgba(148,163,184,.45); background: rgba(148,163,184,.14); color: #475569; cursor: pointer; font-size: 13px; padding: 5px 12px; border-radius: 999px; line-height: 1.4; white-space: nowrap; }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) .theme-toggle { color: #cbd5e1; border-color: #334155; background: #1e293b; }
  }
  html[data-theme="dark"] .theme-toggle { color: #cbd5e1; border-color: #334155; background: #1e293b; }
</style>

  </div>
</header>
<script>
/* FR-X12：登录页自身的深浅切换（header-fix 的注入范围不含 /user/ 页面，这里独立实现） */
(function () {
  var btn = document.getElementById("themeToggle");
  if (!btn) return;
  function apply() {
    var saved = null;
    try { saved = localStorage.getItem("blog_theme"); } catch (e) {}
    var html = document.documentElement;
    var dark = saved ? saved === "dark" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (saved) html.setAttribute("data-theme", saved); else html.removeAttribute("data-theme");
    html.style.colorScheme = dark ? "dark" : "light";
    btn.textContent = dark ? "☀️ 浅色" : "🌙 深色";
  }
  btn.onclick = function () {
    var html = document.documentElement;
    var nowDark = html.getAttribute("data-theme") === "dark" ||
      (!html.getAttribute("data-theme") && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next = nowDark ? "light" : "dark";
    html.setAttribute("data-theme", next);
    html.style.colorScheme = next;
    try { localStorage.setItem("blog_theme", next); } catch (e) {}
    btn.textContent = next === "dark" ? "☀️ 浅色" : "🌙 深色";
  };
  apply();
})();
</script>

<div class="login-wrap">
  <div class="card" id="card">
    <!-- 登录 / 注册 -->
    <div id="authBox">
      <div class="tabs">
        <div class="tab on" data-tab="login" onclick="switchTab('login')">登 录</div>

        <!-- 登录表单 -->
        <form id="loginForm" onsubmit="return doLogin(event)">

      </div>

<script>
"use strict";
const API = "/api";
const TOKEN_KEY = "shawn_site_token";
const USER_KEY = "shawn_site_user";

function $(id) { return document.getElementById(id); }

function readCookie() {
  const token = localStorage.getItem(TOKEN_KEY);
  const user = localStorage.getItem(USER_KEY);
  if (token && user) {
    $("authBox").classList.add("hide");
    $("loggedBox").classList.remove("hide");
    $("loggedName").textContent = user;
    $("navUser").innerHTML = "你好，<b>" + user + "</b><span class=\"out\" onclick=\"logout()\">退出</span>";
    // 已登录状态下校验角色：管理员显示「进入后台」，并把 token 补写为 shawn_admin_token
    // （避免「前台已登录却因缺 shawn_admin_token 进不了后台」的死循环）
    fetch("/api/me", { headers: { "X-Token": token } })
      .then(r => r.json())
      .then(me => {
        const role = me && me.user && me.user.role;
        if (me && me.ok && (role === "admin" || role === "super_admin")) {
          localStorage.setItem("shawn_admin_token", token);
          localStorage.setItem("shawn_admin_role", role);
          const b = $("adminEntryBtn");
          if (b) b.style.display = "inline-block";
        }
      })
      .catch(() => {});
  } else {
    // 登录页自身即登录/注册表单，顶部栏不再重复显示登录/注册按键
    $("navUser").innerHTML = "";
  }
}

async function apiCall(path, body) {
  try {
    const res = await fetch(API + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    return await res.json();
  } catch (e) {
    return { ok: false, msg: "无法连接登录服务，请确认本地服务已启动" };
  }
}

function switchTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
  $("loginForm").classList.toggle("hide", tab !== "login");
  $("registerForm").classList.toggle("hide", tab !== "register");
  $("loginErr").textContent = "";
  $("regErr").textContent = "";
  $("regOk").textContent = "";
}

async function doLogin(e) {
  e.preventDefault();
  const username = $("loginUser").value.trim();
  const password = $("loginPass").value;
  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "登录中…";
  $("loginErr").textContent = "";
  if (!username || !password) { $("loginErr").textContent = "请输入用户名和密码"; $("loginBtn").disabled = false; $("loginBtn").textContent = "登 录"; return false; }
  const r = await apiCall("/login", { username, password });
  if (!r.ok) {
    $("loginErr").textContent = r.msg || "登录失败";
    $("loginBtn").disabled = false; $("loginBtn").textContent = "登 录";
    return false;
  }
  localStorage.setItem(TOKEN_KEY, r.token);
  localStorage.setItem(USER_KEY, r.user.nickname || r.user.username);
  // 兼容全站导航/评论组件的登录态 key（xw_username / xw_token）
  localStorage.setItem("xw_username", r.user.nickname || r.user.username);
  localStorage.setItem("xw_token", r.token);
  // 管理员：存角色标记，跳转后台；普通用户回首页
  if (r.user && (r.user.role === "admin" || r.user.role === "super_admin")) {
    localStorage.setItem("shawn_admin_token", r.token);
    localStorage.setItem("shawn_admin_role", r.user.role);
  }
  $("loginBtn").disabled = false; $("loginBtn").textContent = "登 录";
  const isAdmin = r.user && (r.user.role === "admin" || r.user.role === "super_admin");
  // 优先回跳 next 参数指向的页面（如从文章页登录后回原文）。
  // 含 /admin 时也直接回跳——真实权限由后台 guardAdmin 兜底校验（404），
  // 避免登录响应缺 role 字段时管理员被误拦在首页。
  const next = readNext();
  if (next) {
    window.location.href = next;
    return false;
  }
  // 管理员登录后不自动跳后台：无 next 时统一回首页，进后台由用户自己点「后台管理」入口
  window.location.href = "../index.html";
  return false;
}

/* 读取并校验 next 参数（仅允许站内相对路径，防开放重定向） */
function readNext() {
  try {
    const m = location.search.match(/[?&]next=([^&]+)/);
    if (!m) return "";
    let n = decodeURIComponent(m[1].replace(/\+/g, " "));
    // 只允许站内路径：以 / 开头，且不含 // 或 : 协议
    if (n.indexOf("/") !== 0 || n.indexOf("//") === 0 || /^[a-zA-Z]+:/.test(n)) return "";
    return n;
  } catch (e) { return ""; }
}

async function doRegister(e) {
  e.preventDefault();
  const username = $("regUser").value.trim();
  const nickname = $("regNick").value.trim();
  const password = $("regPass").value;
  const password2 = $("regPass2").value;
  $("regErr").textContent = "";
  $("regOk").textContent = "";
  if (!/^[A-Za-z0-9_\-\.]{3,32}$/.test(username)) { $("regErr").textContent = "用户名需为 3-32 位字母、数字、下划线"; return false; }
  if (password.length < 6) { $("regErr").textContent = "密码至少 6 位"; return false; }
  if (password !== password2) { $("regErr").textContent = "两次输入的密码不一致"; return false; }
  $("regBtn").disabled = true;
  $("regBtn").textContent = "注册中…";
  const r = await apiCall("/register", { username, nickname, password });
  if (!r.ok) {
    $("regErr").textContent = r.msg || "注册失败";
    $("regBtn").disabled = false; $("regBtn").textContent = "注 册";
    return false;
  }
  $("regOk").textContent = "注册成功，正在登录…";
  const lr = await apiCall("/login", { username, password });
  if (lr.ok) {
    localStorage.setItem(TOKEN_KEY, lr.token);
    localStorage.setItem(USER_KEY, lr.user.nickname || lr.user.username);
    localStorage.setItem("xw_username", lr.user.nickname || lr.user.username);
    localStorage.setItem("xw_token", lr.token);
    if (lr.user && (lr.user.role === "admin" || lr.user.role === "super_admin")) {
      localStorage.setItem("shawn_admin_token", lr.token);
      localStorage.setItem("shawn_admin_role", lr.user.role);
    }
    const nxt = readNext();
    setTimeout(() => window.location.href = nxt || "../index.html", 600);
  } else {
    $("regOk").textContent = "注册成功，请切换到登录页登录";
    $("regBtn").disabled = false; $("regBtn").textContent = "注 册";
  }
  return false;
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
  localStorage.removeItem("xw_token");
  localStorage.removeItem("xw_username");
  localStorage.removeItem("shawn_admin_token");
  localStorage.removeItem("shawn_admin_role");
  /* 同步清除后端 Cookie 会话，否则评论区/旧组件读 /api/user/info 仍判为已登录 */
  try { fetch("/api/user/logout", { method: "POST", credentials: "include" }); } catch (e) {}
  $("loggedBox").classList.add("hide");
  $("authBox").classList.remove("hide");
  $("navUser").innerHTML = "";
  $("logoutMsg").textContent = "已退出登录";
}

readCookie();
/* 支持 #register 锚点：打开登录页时若 URL 带 #register，自动切到注册 tab */
if (location.hash === "#register") {
  switchTab('register');
}
</script>
<script>
(function () {
  function fix() {
    var a = document.querySelector('a.logo');
    if (a && a.textContent.trim() !== '清逸的博客') { a.textContent = '清逸的博客'; }
    var fs = document.querySelectorAll('footer span, footer p, footer');
    fs.forEach(function (e) {
      if (e.children.length === 0 && e.textContent.indexOf('shawn') >= 0) {
        e.textContent = e.textContent.replace(/shawn\.com/g, '清逸的博客');
      }
    });
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', fix); } else { fix(); }
  var t = setInterval(function () { fix(); }, 800);
  setTimeout(function () { clearInterval(t); }, 8000);
})();
</script>
<script>
/* 清逸的博客 · 登录页移动端汉堡 */
(function () {
  function build() {
    var header = document.querySelector('header.nav');
    if (!header) return false;
    if (document.querySelector('.mobile-hamburger')) return true;
    var inner = header.querySelector('.inner') || header;
    var btn = document.createElement('button');
    btn.className = 'mobile-hamburger';
    btn.type = 'button';
    btn.setAttribute('aria-label', '菜单');
    var bar = document.createElement('span');
    btn.appendChild(bar);
    var mask = document.createElement('div');
    mask.className = 'mobile-drawer-mask';
    var drawer = document.createElement('div');
    drawer.className = 'mobile-drawer';
    var logo = document.createElement('div');
    logo.className = 'drawer-logo';
    logo.textContent = '清逸的博客';
    var nav = document.createElement('ul');
    nav.className = 'drawer-nav';
    var srcNav = header.querySelector('.nav-links');
    if (srcNav) {
      srcNav.querySelectorAll('a').forEach(function (a) {
        var li = document.createElement('li');
        var na = document.createElement('a');
        na.href = a.getAttribute('href') || '#';
        na.textContent = a.textContent.trim();
        li.appendChild(na);
        nav.appendChild(li);
      });
    }
    drawer.appendChild(logo);
    drawer.appendChild(nav);
    document.body.appendChild(btn);
    document.body.appendChild(mask);
    document.body.appendChild(drawer);
    function toggle(open) {
      var willOpen = (open === undefined) ? !drawer.classList.contains('open') : open;
      drawer.classList.toggle('open', willOpen);
      mask.classList.toggle('show', willOpen);
      btn.classList.toggle('active', willOpen);
      document.body.style.overflow = willOpen ? 'hidden' : '';
    }
    btn.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
    mask.addEventListener('click', function () { toggle(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggle(false); });
    return true;
  }
  function start() {
    if (build()) return;
    var t = setInterval(function () { if (build()) clearInterval(t); }, 500);
    setTimeout(function () { clearInterval(t); }, 15000);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else { start(); }
})();
</script>
<script src="../js/header-fix.js"></script>
